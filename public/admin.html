<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Convidados · Lookout</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{color-scheme:light;--bg:#f7f7f8;--fg:#18181b;--mut:#6b6b76;--card:#fff;--line:#e4e4e7;--pri:#5b4bdb;--pri-fg:#fff;--ok:#15803d;--err:#b91c1c;--chip:#f1f0fe}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111114;--fg:#ececf1;--mut:#9a9aa6;--card:#1b1b20;--line:#2c2c33;--pri:#9d92ff;--pri-fg:#111114;--ok:#4ade80;--err:#f87171;--chip:#26233f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.marca{display:flex;align-items:center;gap:6px;font-weight:700;letter-spacing:.02em;color:var(--pri);font-size:13px;text-transform:uppercase}
h1{font-size:22px;margin:2px 0 0}
a{color:var(--pri)}
.sim{width:20px;height:20px}.lk-olho{fill:#7c3aed}
@media (prefers-color-scheme:dark){.lk-olho{fill:#fff}}
.links{display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px}
form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
@media (max-width:560px){form{grid-template-columns:1fr}}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.pri{background:var(--pri);color:var(--pri-fg);border-color:var(--pri);min-height:44px}
button.perigo{color:var(--err)}
.msg{font-size:14px;margin:10px 0 0;min-height:1em}
.msg.ok{color:var(--ok)}.msg.err{color:var(--err)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.quem strong{display:block}
.quem small{color:var(--mut)}
.chip{font-size:12px;background:var(--chip);color:var(--pri);border-radius:999px;padding:2px 8px;margin-left:6px;font-weight:600}
.acoes{display:flex;flex-wrap:wrap;gap:6px}
.vazio{color:var(--mut)}
.dica{color:var(--mut);font-size:14px;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="marca"><svg viewBox="0 0 64 64" aria-hidden="true" class="sim"><defs><linearGradient id="lk-farol" x1="6" y1="4" x2="58" y2="58" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8B5CF6"/><stop offset="0.4" stop-color="#7C3AED"/><stop offset="1" stop-color="#4F8FF7"/></linearGradient></defs><path fill="url(#lk-farol)" d="M6 32 A26 26 0 0 1 58 32 L40.5 22 A8.5 8.5 0 0 0 23.5 22 Z M26 29 L28 30 L22 58 A28 28 0 0 1 10 50 Z M38 29 L54 50 A28 28 0 0 1 42 58 L36 30 Z"/><circle class="lk-olho" cx="32" cy="22" r="4"/></svg>Lookout</div>
      <h1>Convidados</h1>
    </div>
    <nav class="links"><a href="/">Voltar ao radar</a><a href="/cdn-cgi/access/logout">Sair</a></nav>
  </header>

  <section class="card">
    <h2>Convidar alguém</h2>
    <form id="form">
      <input id="email" type="email" placeholder="email@exemplo.com" required autocomplete="off" aria-label="E-mail">
      <input id="nome" type="text" placeholder="Nome (opcional)" autocomplete="off" aria-label="Nome">
      <button class="pri" type="submit">Adicionar</button>
    </form>
    <p class="msg" id="msg" role="status"></p>
    <p class="dica">Quem estiver na lista entra com o Google ou com um código enviado para o e-mail. Quem não estiver vê a tela de "só para convidados".</p>
  </section>

  <section class="card">
    <h2 id="titulo-lista">Na lista</h2>
    <ul id="lista"><li class="vazio">Carregando…</li></ul>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const site = location.origin;

function quando(iso) {
  if (!iso) return "ainda não entrou";
  const d = new Date(iso);
  return "último acesso em " + d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }) + " às " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

function textoConvite(u) {
  const oi = u.nome ? "Oi, " + u.nome.split(" ")[0] + "!" : "Oi!";
  return `${oi} Te liberei no Lookout, o radar de notícias que eu uso para acompanhar tech, política e futebol. É só entrar em ${site} e fazer login com o Google ou pedir um código no e-mail ${u.email}.`;
}

async function api(caminho, opt) {
  const r = await fetch(caminho, Object.assign({ credentials: "same-origin", cache: "no-store" }, opt || {}));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erro || "Não deu certo (" + r.status + ").");
  return j;
}

function aviso(texto, tipo) { const m = $("msg"); m.textContent = texto; m.className = "msg " + (tipo || ""); }

async function carregar() {
  const { usuarios, admin } = await api("/api/admin/usuarios");
  const ul = $("lista");
  $("titulo-lista").textContent = usuarios.length ? `Na lista (${usuarios.length})` : "Na lista";
  if (!usuarios.length) { ul.innerHTML = '<li class="vazio">Ninguém convidado ainda. Você entra sempre, como administrador' + (admin ? " (" + esc(admin) + ")" : "") + ".</li>"; return; }
  ul.innerHTML = "";
  for (const u of usuarios) {
    const li = document.createElement("li");
    const txt = textoConvite(u);
    const assunto = "Convite para o Lookout";
    li.innerHTML = `<div class="quem"><strong>${esc(u.nome || u.email)}${u.email === admin ? '<span class="chip">admin</span>' : ""}</strong><small>${u.nome ? esc(u.email) + " · " : ""}${quando(u.ultimo_acesso)}</small></div>
      <div class="acoes">
        <a class="btn" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">WhatsApp</a>
        <a class="btn" href="mailto:${encodeURIComponent(u.email)}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(txt)}">E-mail</a>
        <button type="button" data-copiar>Copiar</button>
        <button type="button" class="perigo" data-remover>Remover</button>
      </div>`;
    li.querySelector("[data-copiar]").onclick = async (e) => {
      try { await navigator.clipboard.writeText(txt); e.target.textContent = "Copiado"; setTimeout(() => (e.target.textContent = "Copiar"), 1500); }
      catch { aviso("Não consegui copiar. Use o botão de WhatsApp ou e-mail.", "err"); }
    };
    li.querySelector("[data-remover]").onclick = async () => {
      if (!confirm(`Remover ${u.email} da lista? Os favoritos dessa pessoa também são apagados.`)) return;
      try { await api("/api/admin/usuarios/" + encodeURIComponent(u.email), { method: "DELETE" }); aviso(u.email + " saiu da lista.", "ok"); carregar(); }
      catch (err) { aviso(err.message, "err"); }
    };
    ul.appendChild(li);
  }
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("email").value.trim(), nome = $("nome").value.trim();
  try {
    await api("/api/admin/usuarios", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email, nome }) });
    aviso(email + " entrou na lista. Agora é só mandar o convite.", "ok");
    $("email").value = ""; $("nome").value = "";
    carregar();
  } catch (err) { aviso(err.message, "err"); }
});

carregar().catch((err) => { $("lista").innerHTML = '<li class="vazio">' + esc(err.message) + "</li>"; });
</script>
</body>
</html>
