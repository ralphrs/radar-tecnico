<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · Lookout</title>
<style>
:root {
  --bg: #eef1f8; --fg: #141a2b; --card: #ffffff; --mut: #5b667f;
  --line: rgba(30, 45, 80, 0.12); --pri: #7c3aed; --b1: #8b5cf6; --b2: #4f8ff7;
  /* Radar do fundo: anéis, feixe que gira e pontos que acendem quando o feixe passa */
  --anel: rgba(124, 58, 237, 0.13); --feixe: rgba(124, 58, 237, 0.16); --feixe-borda: rgba(124, 58, 237, 0.34);
  --blip: #7c3aed; --blip-halo: rgba(124, 58, 237, 0.22);
  --sombra: 0 24px 60px -24px rgba(60, 40, 140, 0.28);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #080b16; --fg: #f4f7ff; --card: #131a2b; --mut: #8592ab; --line: rgba(160, 180, 220, 0.14); --pri: #a78bfa;
    --anel: rgba(167, 139, 250, 0.13); --feixe: rgba(139, 92, 246, 0.26); --feixe-borda: rgba(167, 139, 250, 0.55);
    --blip: #c4b5fd; --blip-halo: rgba(139, 92, 246, 0.35);
    --sombra: 0 24px 70px -20px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px 16px;
  position: relative; overflow-x: hidden;
}
/* Anéis e mira do radar, centrados atrás do cartão e sumindo nas bordas */
body::after {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    linear-gradient(var(--anel), var(--anel)) 50% 0 / 1px 100% no-repeat,
    linear-gradient(var(--anel), var(--anel)) 0 50% / 100% 1px no-repeat,
    repeating-radial-gradient(circle at 50% 50%, transparent 0 calc(13vmin - 1px), var(--anel) calc(13vmin - 1px) 13vmin);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 35%, transparent 72%);
  mask-image: radial-gradient(circle at 50% 50%, #000 35%, transparent 72%);
}
/* Feixe de varredura: uma volta a cada 12 s, no sentido do relógio */
body::before {
  content: ""; position: fixed; left: 50%; top: 50%; width: 170vmax; height: 170vmax;
  z-index: 0; pointer-events: none; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0deg 285deg, var(--feixe) 345deg, var(--feixe-borda) 359.5deg, transparent 360deg);
  -webkit-mask-image: radial-gradient(circle, #000 12%, transparent 42%);
  mask-image: radial-gradient(circle, #000 12%, transparent 42%);
  transform: translate(-50%, -50%) rotate(0deg);
  animation: varredura 12s linear infinite;
}
/* Notícias detectadas: pontos que acendem quando o feixe passa e apagam devagar */
html::before, html::after {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0;
  animation: blip 12s ease-out infinite;
}
html::before {
  background:
    radial-gradient(circle at calc(50% + 29.4vmin) calc(50% - 17vmin), var(--blip) 0 3px, var(--blip-halo) 4px, transparent 14px),
    radial-gradient(circle at calc(50% + 40.3vmin) calc(50% - 19.7vmin), var(--blip) 0 2.5px, var(--blip-halo) 3.5px, transparent 11px);
  animation-delay: 2s;
}
html::after {
  background:
    radial-gradient(circle at calc(50% - 25.7vmin) calc(50% + 30.6vmin), var(--blip) 0 3px, var(--blip-halo) 4px, transparent 14px),
    radial-gradient(circle at calc(50% - 36.5vmin) calc(50% + 21.1vmin), var(--blip) 0 2.5px, var(--blip-halo) 3.5px, transparent 11px);
  animation-delay: 7.4s;
}
@keyframes varredura { to { transform: translate(-50%, -50%) rotate(360deg); } }
@keyframes blip { 0% { opacity: 1; } 35% { opacity: 0; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  body::before { animation: none; transform: translate(-50%, -50%) rotate(70deg); }
  html::before, html::after { animation: none; opacity: .7; }
}
main {
  width: 100%; max-width: 400px; background: var(--card);
  border: 1px solid var(--line); border-radius: 20px;
  padding: 32px 28px 28px; position: relative; overflow: hidden;
  z-index: 1; box-shadow: var(--sombra);
}
main::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 4px;
  background-image: linear-gradient(135deg, var(--b1), var(--b2));
}
.marca { display: flex; align-items: center; gap: 10px; color: var(--pri); margin-bottom: 20px; }
.marca .lk-lockup { height: 44px; width: auto; display: block; }
.lk-nome { fill: var(--fg); }
.lk-olho { fill: #7c3aed; }
@media (prefers-color-scheme: dark) { .lk-olho { fill: #ffffff; } }
h1 { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; font-size: 24px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.01em; }
.sub { color: var(--mut); margin: 0 0 22px; }
.aviso { background: color-mix(in srgb, var(--pri) 10%, transparent); color: var(--fg); border-radius: 12px; padding: 10px 12px; margin: 0 0 16px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="marca"><svg class="lk-lockup" viewBox="0 0 198 64" role="img" aria-label="Lookout"><defs><linearGradient id="lk-farol-lockup" x1="6" y1="4" x2="58" y2="58" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8B5CF6"/><stop offset="0.4" stop-color="#7C3AED"/><stop offset="1" stop-color="#4F8FF7"/></linearGradient></defs><path transform="translate(0 1)" fill="url(#lk-farol-lockup)" d="M6 32 A26 26 0 0 1 58 32 L40.5 22 A8.5 8.5 0 0 0 23.5 22 Z M26 29 L28 30 L22 58 A28 28 0 0 1 10 50 Z M38 29 L54 50 A28 28 0 0 1 42 58 L36 30 Z"/><circle class="lk-olho" cx="32" cy="23" r="4"/><path transform="matrix(.92 0 0 1 5.76 .75)" class="lk-nome" fill-rule="evenodd" d="M72 19 H77 V38 H87 V43 H72 Z M98 25 A9 9 0 1 1 98 43 A9 9 0 1 1 98 25 Z M98 29.5 A4.5 4.5 0 1 0 98 38.5 A4.5 4.5 0 1 0 98 29.5 Z M118 25 A9 9 0 1 1 118 43 A9 9 0 1 1 118 25 Z M118 29.5 A4.5 4.5 0 1 0 118 38.5 A4.5 4.5 0 1 0 118 29.5 Z M130 19 H135 V32 L141.5 25.5 H148 L139.5 33.5 L148.5 43 H142 L135 35.5 V43 H130 Z M158 25 A9 9 0 1 1 158 43 A9 9 0 1 1 158 25 Z M158 29.5 A4.5 4.5 0 1 0 158 38.5 A4.5 4.5 0 1 0 158 29.5 Z M170 25.5 H175 V35.5 Q175 39 178 39 Q182 39 182 34.5 V25.5 H187 V43 H182 V41 Q180 43.5 176.5 43.5 Q170 43.5 170 36 Z M193 20 H198 V25.5 H202 V30 H198 V36.5 Q198 39 200 39 H202 V43 Q200.5 43.5 198.5 43.5 Q193 43.5 193 37.5 V30 H190 V25.5 H193 Z"/></svg></div>
  <h1>Entrar no radar</h1>
  <p class="sub">Tech, política e futebol num lugar só. Use a conta do Google do e-mail em que você recebeu o convite.</p>
  {% if message.text.size > 0 %}
  <p class="aviso" role="status">{{ message.text }}</p>
  {% endif %}
  <cf-access-authbox></cf-access-authbox>
</main>
</body>
</html>
