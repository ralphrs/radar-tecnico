<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · Lookout</title>
<style>
:root {
  --bg: #eef1f8; --fg: #141a2b; --card: #ffffff; --mut: #5b667f;
  --line: rgba(30, 45, 80, 0.12); --pri: #7c3aed; --b1: #8b5cf6; --b2: #4f8ff7;
  /* Radar do fundo: anéis, feixe que gira e pontos que acendem quando o feixe passa */
  --anel: rgba(124, 58, 237, 0.13); --feixe: rgba(124, 58, 237, 0.16); --feixe-borda: rgba(124, 58, 237, 0.34);
  --blip: #7c3aed; --blip-halo: rgba(124, 58, 237, 0.22);
  --sombra: 0 24px 60px -24px rgba(60, 40, 140, 0.28); --brilho: rgba(139, 92, 246, 0.22);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #080b16; --fg: #f4f7ff; --card: #131a2b; --mut: #8592ab; --line: rgba(160, 180, 220, 0.14); --pri: #a78bfa;
    --anel: rgba(167, 139, 250, 0.13); --feixe: rgba(139, 92, 246, 0.26); --feixe-borda: rgba(167, 139, 250, 0.55);
    --blip: #c4b5fd; --blip-halo: rgba(139, 92, 246, 0.35);
    --sombra: 0 24px 70px -20px rgba(0, 0, 0, 0.7); --brilho: rgba(139, 92, 246, 0.35);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px 16px;
  position: relative; overflow-x: hidden;
}
/* Anéis e mira do radar, centrados atrás do cartão e sumindo nas bordas */
body::after {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    linear-gradient(var(--anel), var(--anel)) 50% 0 / 1px 100% no-repeat,
    linear-gradient(var(--anel), var(--anel)) 0 50% / 100% 1px no-repeat,
    repeating-radial-gradient(circle at 50% 50%, transparent 0 calc(13vmin - 1px), var(--anel) calc(13vmin - 1px) 13vmin);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 35%, transparent 72%);
  mask-image: radial-gradient(circle at 50% 50%, #000 35%, transparent 72%);
}
/* Feixe de varredura: uma volta a cada 12 s, no sentido do relógio */
body::before {
  content: ""; position: fixed; left: 50%; top: 50%; width: 170vmax; height: 170vmax;
  z-index: 0; pointer-events: none; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0deg 285deg, var(--feixe) 345deg, var(--feixe-borda) 359.5deg, transparent 360deg);
  -webkit-mask-image: radial-gradient(circle, #000 12%, transparent 42%);
  mask-image: radial-gradient(circle, #000 12%, transparent 42%);
  transform: translate(-50%, -50%) rotate(0deg);
  animation: varredura 12s linear infinite;
}
/* Notícias detectadas: pontos que acendem quando o feixe passa e apagam devagar */
html::before, html::after {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0;
  animation: blip 12s ease-out infinite;
}
html::before {
  background:
    radial-gradient(circle at calc(50% + 29.4vmin) calc(50% - 17vmin), var(--blip) 0 3px, var(--blip-halo) 4px, transparent 14px),
    radial-gradient(circle at calc(50% + 40.3vmin) calc(50% - 19.7vmin), var(--blip) 0 2.5px, var(--blip-halo) 3.5px, transparent 11px);
  animation-delay: 2s;
}
html::after {
  background:
    radial-gradient(circle at calc(50% - 25.7vmin) calc(50% + 30.6vmin), var(--blip) 0 3px, var(--blip-halo) 4px, transparent 14px),
    radial-gradient(circle at calc(50% - 36.5vmin) calc(50% + 21.1vmin), var(--blip) 0 2.5px, var(--blip-halo) 3.5px, transparent 11px);
  animation-delay: 7.4s;
}
@keyframes varredura { to { transform: translate(-50%, -50%) rotate(360deg); } }
@keyframes blip { 0% { opacity: 1; } 35% { opacity: 0; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  body::before { animation: none; transform: translate(-50%, -50%) rotate(70deg); }
  html::before, html::after { animation: none; opacity: .7; }
}
main {
  width: 100%; max-width: 360px; background: var(--card);
  border: 1px solid var(--line); border-radius: 24px;
  margin-top: 56px; padding: 76px 28px 28px; position: relative;
  z-index: 1; box-shadow: var(--sombra);
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
/* Símbolo do farol num círculo, metade para fora do topo do cartão */
.farol {
  position: absolute; left: 50%; top: -56px; width: 112px; height: 112px; margin-left: -56px;
  border-radius: 50%; background: var(--card); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 10px var(--brilho);
}
.farol svg { width: 76px; height: 76px; display: block; }
.lk-olho { fill: #7c3aed; }
@media (prefers-color-scheme: dark) { .lk-olho { fill: #ffffff; } }
.marca { margin: 0 0 10px; font: 600 12px/16px "Inter", ui-sans-serif, system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--pri); }
h1 { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; font-size: 28px; line-height: 1.15; margin: 0 0 10px; letter-spacing: -0.02em; text-wrap: balance; }
.sub { color: var(--mut); margin: 0 0 24px; text-wrap: pretty; }
.aviso { align-self: stretch; background: color-mix(in srgb, var(--pri) 10%, transparent); color: var(--fg); border-radius: 12px; padding: 10px 12px; margin: 0 0 16px; font-size: 14px; }
cf-access-authbox { align-self: stretch; text-align: left; }
</style>
</head>
<body>
<main>
  <div class="farol"><svg viewBox="0 0 64 64" role="img" aria-label="Lookout"><defs><linearGradient id="lk-farol" x1="6" y1="4" x2="58" y2="58" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8B5CF6"/><stop offset="0.4" stop-color="#7C3AED"/><stop offset="1" stop-color="#4F8FF7"/></linearGradient></defs><path fill="url(#lk-farol)" d="M6 32 A26 26 0 0 1 58 32 L40.5 22 A8.5 8.5 0 0 0 23.5 22 Z M26 29 L28 30 L22 58 A28 28 0 0 1 10 50 Z M38 29 L54 50 A28 28 0 0 1 42 58 L36 30 Z"/><circle class="lk-olho" cx="32" cy="22" r="4"/></svg></div>
  <p class="marca">Lookout</p>
  <h1>De olho no que importa</h1>
  <p class="sub">Tecnologia, política e futebol, filtrados e atualizados ao longo do dia.</p>
  {% if message.text.size > 0 %}
  <p class="aviso" role="status">{{ message.text }}</p>
  {% endif %}
  <cf-access-authbox></cf-access-authbox>
</main>
</body>
</html>
